services:

  prometheus:
    image: prom/prometheus:latest
    container_name: dsts-prometheus
    restart: unless-stopped

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    extra_hosts:
      - "host.docker.internal:host-gateway"


  grafana:
    image: grafana/grafana:latest
    container_name: dsts-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      # S5 fix: do NOT hard-code admin password here.
      # Set GRAFANA_ADMIN_PASSWORD in your shell environment or a .env file before
      # running docker compose.  Example:
      #   export GRAFANA_ADMIN_PASSWORD=$(openssl rand -base64 24)
      #   docker compose up -d
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}"
      # S5 fix: anonymous viewer access disabled — all users must authenticate
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ORG_ROLE: ""
      # S5 fix: embedding disabled (CSRF/clickjacking mitigation)
      GF_SECURITY_ALLOW_EMBEDDING: "false"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus