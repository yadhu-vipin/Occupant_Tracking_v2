global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: "dsts"

    scrape_interval: 5s

    metrics_path: /metrics

    # /metrics requires this bearer token (DSTS_METRICS_TOKEN on the server).
    # Put the same token, with no trailing newline, in monitoring/metrics_token.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token

    static_configs:
      - targets:
          - "host.docker.internal:8000"